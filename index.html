<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>異物通報</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;margin:0;padding:20px;background:#f5f5f5;color:#333}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 8px}
label{display:block;font-size:15px;font-weight:bold;margin:14px 0 6px}
input[type=text],textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid #ccc;border-radius:8px}
textarea{min-height:110px;resize:vertical}
button{width:100%;margin-top:20px;padding:14px;font-size:17px;font-weight:bold;color:#fff;background:#06c755;border:none;border-radius:10px}
button:disabled{background:#aaa}
#msg{margin-top:12px;font-size:14px;min-height:20px}
.ok{color:#06c755}.err{color:#d63031}
</style>
</head>
<body>
<div class="card">
<h1>異物通報</h1>
<label for="className">班級</label>
<input id="className" type="text" placeholder="請輸入班級" autocomplete="off">
<label for="content">內容</label>
<textarea id="content" placeholder="請描述異物狀況"></textarea>
<button id="submitBtn">送出</button>
<p id="msg"></p>
</div>
<script>
var LIFF_ID = "2012056969-Le2wDP1o";
var API_URL = "https://yziolqokktledpibgmoa.supabase.co/functions/v1/line-webhook";
var msg = document.getElementById("msg");
var btn = document.getElementById("submitBtn");
function setMsg(t, cls){ msg.textContent = t; msg.className = cls || "";}
async function init(){
try { await liff.init({ liffId: LIFF_ID});}
catch(e){ setMsg("LIFF 初始化失敗，請從 LINE 群組內重新開啟", "err"); btn.disabled = true;}
}
btn.addEventListener("click", async function(){
var className = document.getElementById("className").value.trim();
var content = document.getElementById("content").value.trim();
if(!className){ setMsg("請輸入班級", "err"); return;}
if(!content){ setMsg("請輸入內容", "err"); return;}
btn.disabled = true;
setMsg("送出中…", "");
try{
var ctx = {};
try { ctx = liff.getContext() || {};} catch(e) {}
var targetId = ctx.groupId || ctx.roomId || ctx.userId || "";
if(!targetId){ setMsg("請從 LINE 群組中開啟此表單", "err"); btn.disabled = false; return;}
var res = await fetch(API_URL, {
method: "POST",
headers: { "Content-Type": "application/json"},
body: JSON.stringify({ action: "submit-report", targetId: targetId, userId: ctx.userId || "", className: className, content: content})
});
var data = await res.json().catch(function(){ return {};});
if(!res.ok) throw new Error(data.error || ("HTTP " + res.status));
setMsg("已送出，請接著上傳異物照片", "ok");
setTimeout(function(){ try { liff.closeWindow();} catch(e){ window.close();}}, 1200);
}catch(e){
setMsg("送出失敗：" + e.message + "，請重試", "err");
btn.disabled = false;
}
});
init();
</script>
</body>
</html>
