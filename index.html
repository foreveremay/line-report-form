<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>異物通報</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;margin:0;padding:20px;background:#f5f5f5;color:#333}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 8px}
label{display:block;font-size:15px;font-weight:bold;margin:14px 0 6px}
input[type=text],textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid #ccc;border-radius:8px}
textarea{min-height:110px;resize:vertical}
button{width:100%;margin-top:20px;padding:14px;font-size:17px;font-weight:bold;color:#fff;background:#06c755;border:none;border-radius:10px}
button:disabled{background:#aaa}
#msg{margin-top:12px;font-size:14px;min-height:20px}
.ok{color:#06c755}.err{color:#d63031}
</style>
</head>
<body>
<div class="card">
<h1>異物通報</h1>
<label for="className">輸入發生地點（班級/座號）</label>
<input id="className" type="text" placeholder="例如：大忠班/25號" autocomplete="off">
<label for="content">相關細節內容</label>
<textarea id="content" placeholder="請描述異物狀況"></textarea>
<button id="submitBtn">送出</button>
<p id="msg"></p>
</div>
<script>
var API_URL = "https://yziolqokktledpibgmoa.supabase.co/functions/v1/line-webhook";
var msg = document.getElementById("msg");
var btn = document.getElementById("submitBtn");
function setMsg(t, cls){ msg.textContent = t; msg.className = cls || "";}
// 群組 ID 從網址參數取得（由 bot 按鈕帶入），免 LIFF、免認證
var targetId = new URLSearchParams(window.location.search).get("groupId") || "";
if(!targetId){
  setMsg("此表單需從 LINE 群組內的通報選單開啟", "err");
  btn.disabled = true;
}
btn.addEventListener("click", async function(){
var className = document.getElementById("className").value.trim();
var content = document.getElementById("content").value.trim();
if(!className){ setMsg("請輸入發生地點", "err"); return;}
if(!content){ setMsg("請輸入相關細節內容", "err"); return;}
btn.disabled = true;
setMsg("送出中…", "");
try{
var res = await fetch(API_URL, {
method: "POST",
headers: { "Content-Type": "application/json"},
body: JSON.stringify({ action: "submit-report", targetId: targetId, className: className, content: content})
});
var data = await res.json().catch(function(){ return {};});
if(!res.ok) throw new Error(data.error || ("HTTP " + res.status));
setMsg("已送出，請回到群組上傳異物照片", "ok");
setTimeout(function(){ window.close(); }, 1500);
}catch(e){
setMsg("送出失敗：" + e.message + "，請重試", "err");
btn.disabled = false;
}
});
</script>
</body>
</html>
